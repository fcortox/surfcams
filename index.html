    document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);

  * { box-sizing: border-box; }
  body { font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: var(--text); background: var(--body-bg); background-attachment: fixed; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 56px; }

  /* En-tête fixe : son fond reprend celui de la page (fixé au viewport) pour masquer le contenu qui défile dessous. */
  .titlebar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; margin: 0 -24px 12px; padding: 12px 24px; background: var(--body-bg); background-attachment: fixed; }
  .titlebar .top { flex: 1 1 auto; }
  .skin-picker { position: relative; flex: none; }
  .skin-picker::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border: solid var(--text); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
  .skin-picker select { width: 150px; appearance: none; -webkit-appearance: none; font: inherit; font-size: .85rem; line-height: 1.2; padding: 8px 40px 8px 16px; border-radius: 999px; border: 1px solid var(--h1-color); background-color: var(--meteo-bg); color: var(--text); cursor: pointer; }
  /* menu centré sur la ligne « Local surf report » (line-height 1rem ; menu ~34 px) : même position pour tous les styles */
  .controls { display: flex; align-items: center; gap: 16px; margin-left: auto; margin-top: -9px; }
  .skin-picker select:focus, .skin-picker select:focus-visible { outline: none; }


  .top { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  h1 { margin: 0; font-family: var(--h1-font); font-size: var(--h1-size); font-weight: var(--h1-weight); letter-spacing: var(--h1-ls); color: var(--h1-color); text-shadow: var(--h1-shadow); white-space: nowrap; background: var(--h1-fill); -webkit-background-clip: text; background-clip: text; line-height: 1.1; }
  .wave { height: var(--wave-h); margin: 0; background: var(--wave) repeat-x left center; }
  .subtitle { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin: 0; min-height: 1.6em; font-size: var(--subtitle-size); color: var(--subtitle-color); }
  .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  [data-skin="retro"] .stats, [data-skin="lightav"] .stats { gap: 16px 18px; }
  [data-skin="retro"] .subtitle, [data-skin="lightav"] .subtitle { margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: 6px; }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 150px; padding: 10px 20px 9px; border-radius: 16px; background: var(--chip-bg); border: 2px solid var(--chip-border); }
  [data-skin="ocean"] .stat { border-width: 1px; }
  .stat-val { display: flex; align-items: baseline; font-family: var(--h2-font); font-size: 2.1rem; font-weight: 700; line-height: 1.1; color: var(--text); }
  [data-skin="retro"] .stat-val, [data-skin="lightav"] .stat-val, [data-skin="psy"] .stat-val { font-weight: 400; }
  .stat.center .stat-val { justify-content: center; }
  .stat-val small { font-family: "DM Sans", system-ui, sans-serif; font-size: .9rem; font-weight: 500; margin-left: 4px; color: var(--muted); }
  .stat-val .per { display: flex; align-items: baseline; margin-left: 16px; }
  .tide-ic { font-family: system-ui, "Segoe UI Symbol", "Apple Symbols", sans-serif; font-style: normal; font-weight: 700; -webkit-text-stroke: 1px currentColor; align-self: center; margin-right: 10px; font-size: 1.1rem; color: var(--arrow); }
  .stat-val .arrow { margin-left: 10px; font-size: 1.6rem; align-self: center; }
  .eyebrow { margin: 0; font-size: .72rem; line-height: 1rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--subtitle-color); }
  .stat-label { align-self: center; text-align: center; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .chip { color: var(--text); font-size: .78rem; padding: 5px 11px; border-radius: 999px; background: var(--chip-bg); border: 2px solid var(--chip-border); font-weight: var(--chip-weight); white-space: nowrap; }
  [data-skin="ocean"] .chip, [data-skin="surfclub"] .chip { border-width: 1px; }
  [data-skin="surfclub"] .eyebrow { font-size: .8rem; letter-spacing: .34em; }
  .chip + .chip::before { content: var(--chip-sep); margin: 0 8px; }
  [data-skin="retro"] .chip:nth-child(5n+2), [data-skin="lightav"] .chip:nth-child(5n+2) { border-color: #f28c1e; }
  [data-skin="retro"] .chip:nth-child(5n+3), [data-skin="lightav"] .chip:nth-child(5n+3) { border-color: #e0312b; }
  [data-skin="retro"] .chip:nth-child(5n+4), [data-skin="lightav"] .chip:nth-child(5n+4) { border-color: #1c75bc; }
  [data-skin="retro"] .chip:nth-child(5n), [data-skin="lightav"] .chip:nth-child(5n) { border-color: #2a7a9b; }
  [data-skin="psy"] .chip:nth-child(5n+1) { background: #f9d46b; } [data-skin="psy"] .chip:nth-child(5n+2) { background: #8fd1c9; }
  [data-skin="psy"] .chip:nth-child(5n+3) { background: #f2a6b8; } [data-skin="psy"] .chip:nth-child(5n+4) { background: #9cc8ea; }
  [data-skin="psy"] .chip:nth-child(5n) { background: #f7b27a; }
  [data-skin="psy"] .frame { border-bottom: 3px solid #1d3557; }
  [data-skin="psy"] .meteo td.tide { background: linear-gradient(to top, transparent var(--p), #fdf3d6 var(--p)) content-box, linear-gradient(to top, #e2574c, #f6c453) content-box; }
  [data-skin="psy"] .meteo td.tide.now { background: linear-gradient(to top, transparent var(--p), #f9c97a var(--p)) content-box, linear-gradient(to top, #e2574c, #f6c453) content-box, linear-gradient(#f9c97a, #f9c97a) border-box; }
  /* Flèches : police système et aucun style italique hérité (Shrikhand/Modak sont penchées et déformaient le symbole) */
  .subtitle .arrow, .meteo .arrow { display: inline-block; margin-left: 4px; color: var(--arrow); font-weight: 400; font-style: normal; font-synthesis: none; font-family: system-ui, "Segoe UI Symbol", "Apple Symbols", sans-serif; }

  .meteo { margin: 32px 0 0; overflow-x: auto; border-radius: var(--radius); background: var(--meteo-bg); border: var(--meteo-border); }
  .meteo:empty { display: none; }
  .source { margin: 8px 0 9px;   /* 8 + 15 (ligne) + 9 = 32 px sous le tableau, comme au-dessus */ text-align: right; font-size: .68rem; letter-spacing: .02em; color: var(--subtitle-color); opacity: .6; }
  .source:empty { display: none; }
  .source:empty + .grid { margin-top: 32px; }
  .meteo table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .9rem; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meteo th, .meteo td { padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .meteo td { padding: 8px 8px; }
  .meteo td.newday { border-left: 2px solid color-mix(in srgb, var(--muted) 55%, transparent); }
  .meteo tr:last-child th, .meteo tr:last-child td { border-bottom: 0; }
  .meteo tr.resume td { padding: 7px 10px; text-align: center; vertical-align: top; white-space: normal; font-size: .85rem; line-height: 1.35; color: var(--muted); }
  .meteo tr.resume td > div { width: 0; min-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meteo tr.resume b { margin-right: .4em; color: var(--text); font-weight: 700; }
  .quote { display: flex; align-items: flex-start; gap: 8px; max-width: 780px; margin: 0; }
  .quote::before, .quote::after { flex: none; font-family: var(--h2-font); font-size: 4.2rem; font-weight: 400; line-height: .85; color: var(--arrow); }
  .quote::before { content: "\201C"; }
  .quote::after { content: "\201D"; align-self: flex-end; line-height: .5; }
  .quote-text { flex: 1; padding-top: 6px; font-size: .95rem; line-height: 1.4; color: var(--subtitle-color); }
  .quote-text b { display: block; font-size: 1.15rem; color: var(--text); }
  .meteo th { position: sticky; left: 0; z-index: 2; background: var(--th-bg); color: var(--th-color); text-align: left; font-size: var(--th-size); font-weight: 600; letter-spacing: var(--th-ls); text-transform: var(--th-tf); border-right: 1px solid var(--th-border); box-shadow: var(--th-shadow); }
  .meteo .day { display: block; font-size: .7rem; font-weight: 400; color: var(--muted); text-transform: capitalize; }
  .meteo tr.hours td { font-weight: 600; background: var(--hours-bg); }
  .meteo td.now { background: var(--now-bg); }
  .meteo tr.hours td.now { background: var(--nowhead-bg); color: var(--nowhead-color); }
  .meteo tr.hours td.now .day { color: var(--nowhead-day); }
  .meteo td.wx { font-size: 1.05rem; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .meteo td.tide { position: relative; height: 60px; padding: 0 2px; background: linear-gradient(to top, var(--tide) var(--p), transparent var(--p)) content-box; font-size: .75rem; }
  .meteo td.tide.now { background: linear-gradient(to top, var(--tide-now) var(--p), transparent var(--p)) content-box, linear-gradient(var(--tide-now-bg), var(--tide-now-bg)) border-box; }
  .meteo td.tide span { position: relative; display: block; padding: 5px; line-height: 1.25; }
  .meteo td.tide .ti { font-family: system-ui, "Segoe UI Symbol", "Apple Symbols", sans-serif; font-style: normal; font-weight: 400; display: block; font-size: .7rem; color: var(--ti); }

  .sk { display: block; height: 14px; min-width: 38px; border-radius: 6px; background: linear-gradient(90deg, var(--sk-a) 25%, var(--sk-b) 50%, var(--sk-a) 75%) 0 0 / 200% 100%; animation: sk 1.2s linear infinite; }
  .subtitle .sk-line { width: 260px; max-width: 100%; height: 28px; border-radius: 999px; }
  .subtitle .sk-stat { width: 150px; height: 70px; border-radius: 16px; }
  .meteo table.loading tr:last-child td { height: 60px; }
  @keyframes sk { to { background-position: -200% 0; } }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .cam { background: var(--cam-bg); border: var(--cam-border); border-radius: var(--cam-radius); box-shadow: var(--cam-shadow); overflow: hidden; }
  .cam::before { content: ""; display: block; height: var(--stripe-h); background: var(--stripe-bg); }
  .head { display: flex; align-items: center; justify-content: flex-start; gap: 10px; padding: var(--head-pad); flex-wrap: wrap; }
  [data-skin="ocean"] .head, [data-skin="surfclub"] .head, [data-skin="retro"] .head, [data-skin="lightav"] .head, [data-skin="psy"] .head { justify-content: space-between; }
  .cam h2 { margin: 0; font-family: var(--h2-font); font-size: var(--h2-size); font-weight: var(--h2-weight); letter-spacing: var(--h2-ls); color: var(--h2-color); background: var(--h2-fill); -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: var(--h2-stroke); }
  .badge { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--badge-bg); color: var(--badge-color); border: 2px solid var(--badge-border); white-space: nowrap; }
  .badge.live { background: var(--live-bg); color: var(--live-color); border-color: var(--live-border); }
  .badge.live::before { content: ""; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--live-dot); }
  [data-skin="ocean"] .badge.live::before, [data-skin="surfclub"] .badge.live::before, [data-skin="retro"] .badge.live::before, [data-skin="lightav"] .badge.live::before, [data-skin="psy"] .badge.live::before { animation: pulse 1.7s ease-in-out infinite; }
  .badge.off { background: var(--off-bg); color: var(--off-color); border-color: var(--off-border); }
  @keyframes pulse { 50% { opacity: .35; } }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--frame-bg); }
  .frame .video-js, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .err { position: absolute; inset: auto 8px 8px 8px; font-size: .8rem; color: #fca5a5; z-index: 5; }

  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { h1 { font-size: min(var(--h1-size), 6.5vw); } [data-skin="retro"] h1, [data-skin="lightav"] h1 { text-shadow: 1px 1px 0 #f5a81c, 2px 2px 0 #f28c1e, 3px 3px 0 #e0312b, 4px 4px 0 #1c75bc; } .wrap { padding: 24px 14px 40px; } .titlebar { margin: 0 -14px 12px; padding: 10px 14px; } .titlebar .top { flex-basis: 100%; } [data-skin] .eyebrow { white-space: nowrap; font-size: .62rem; letter-spacing: .08em; } .controls { position: absolute; top: 1px; right: 14px; margin: 0; } .skin-picker select { width: 120px; padding: 8px 32px 8px 12px; } .skin-picker::after { right: 12px; } [data-skin] .stats { gap: 10px; } .stat { padding: 10px 14px 9px; min-width: 120px; } .stat-val { font-size: 1.8rem; } .stat-val .per { margin-left: 10px; } .stat-val .arrow { margin-left: 6px; font-size: 1.4rem; } .quote::before, .quote::after { font-size: 3rem; } .quote-text { font-size: .85rem; } .quote-text b { font-size: 1rem; } .grid { gap: 20px; }  }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <header class="top">
      <p class="eyebrow" id="eyebrow">Surf report</p>
      <h1>Hossegor - La Gravière</h1>
    </header>
    <div class="controls">
    <div class="skin-picker">
      <select id="skin" aria-label="Style de la page">
        <option value="ocean">Océan</option>
        <option value="surfclub">Pl. des Landais</option>
        <option value="retro">Dark AV</option>
        <option value="lightav">Light AV</option>
        <option value="psy">Psy</option>
      </select>
    </div>
    </div>
  </div>
  <p class="subtitle" id="subtitle"></p>
  <div class="wave" aria-hidden="true"></div>
  <div class="meteo" id="meteo"></div>
  <p class="source" id="source"></p>
  <div class="grid" id="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/7.21.5/video.min.js"></script>
<script src="https://viewsurf.quanteec.com/lib/quanteec/3.0.2/videojs-quanteec-plugin.js"></script>
<script>
  const skinSelect = document.getElementById('skin');
  skinSelect.value = document.documentElement.dataset.skin;
  if (skinSelect.value !== document.documentElement.dataset.skin) skinSelect.value = 'retro';
  skinSelect.addEventListener('change', () => {
    document.documentElement.dataset.skin = skinSelect.value;
    setFavicon(skinSelect.value);
    try { localStorage.setItem('skin', skinSelect.value); } catch (e) {}
  });
</script>
<script>
  // type "live" / "vod" : lecteur Quanteec ; "iframe" : embed ViewSurf
  const CAMS = [
    { title: 'La Centrale',   type: 'live', id: '04593c63-5af6-462d-3536-3230-6d61-63-9bbe-827fb3625ccfd', poster: 'https://films.viewsurf.com/hossegor01_live.stream/media.jpg' },
    { title: 'La Nord',       type: 'vod',  page: 'https://gosurf.fr/webcam/fr/170/Hossegor-Plage-de-la-Nord', id: '7ec800b7-d98b-4c19-3636-3230-6d61-63-8bdb-519f8ef13dd6d', poster: 'https://films.viewsurf.com/hossegor02/1/1/media_1793094603.jpg' },
    { title: 'Les Estagnots', type: 'vod',  page: 'https://www.viewsurf.com/univers/surf/vue/14374-france-aquitaine-seignosse-les-estagnots', id: 'f15ff798-7425-42ce-3937-3430-6d61-63-8d21-f67fba7df4e1d' },
    { title: 'Les Bourdaines', type: 'live', id: '8da4aff9-9afb-47ce-3937-3430-6d61-63-b10b-bae5e6dead40d', poster: 'https://films.viewsurf.com/seignosse01_live/media.jpg' },
    { title: 'Le Penon',      type: 'live', id: '0c5055bb-8a96-4c3c-3837-3430-6d61-63-943b-480da283f7bed', poster: 'https://films.viewsurf.com/seignosse02_live/media.jpg' },
    { title: 'Santosha',      type: 'live', id: '0c2f35a6-eb76-46ee-3932-3130-6d61-63-9e6e-ec65d58221a1d', poster: 'https://films.viewsurf.com/capbreton02_live/media.jpg' },
    { title: 'Le Prévent',    type: 'live', id: 'c2e5b4bd-c7be-413f-3832-3130-6d61-63-9268-057378aad627d', poster: 'https://films.viewsurf.com/capbreton01_live/media.jpg' },
  ];

  // Les enregistrements changent d'identifiant à chaque mise à jour : on relit l'identifiant courant sur la page GoSurf
  // (via le relais r.jina.ai), et on garde celui du tableau CAMS si la lecture échoue.
  async function currentSource(cam) {
    if (!cam.page) return cam;
    try {
      const res = await fetch('https://r.jina.ai/' + cam.page, { headers: { 'X-No-Cache': 'true', 'X-Return-Format': 'html' } });
      const html = await res.text();
      const v = new DOMParser().parseFromString(html, 'text/html').querySelector('video-js[data-src]');
      if (v) return { ...cam, id: v.dataset.src, poster: v.dataset.poster || cam.poster };
      const m = html.match(/embeded\.html\?uuid=([0-9a-f-]+)/);   // page ViewSurf : lecteur en iframe
      if (m) return { ...cam, id: m[1] };
    } catch (e) {}
    return cam;
  }

  const fmt = d => d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

  // Direct = playlist non terminée avec un segment récent ; sinon on affiche la date du dernier contenu.
  async function updateBadge(badge, masterUrl, isLive) {
    try {
      const master = await (await fetch(masterUrl, { cache: 'no-store' })).text();
      const rel = master.split('\n').find(l => l.trim() && !l.startsWith('#'));
      const res = await fetch(new URL(rel.trim(), masterUrl), { cache: 'no-store' });
      const body = await res.text();
      const pdt = body.match(/#EXT-X-PROGRAM-DATE-TIME:(\S+)/g);
      const last = pdt ? new Date(pdt[pdt.length - 1].split(':').slice(1).join(':')) : null;
      const lm = res.headers.get('last-modified') ? new Date(res.headers.get('last-modified')) : null;
      const ended = /#EXT-X-ENDLIST/.test(body);

      if (!ended && last && Date.now() - last.getTime() < 120000) {
        badge.className = 'badge live'; badge.textContent = 'LIVE';
      } else if (!last) {
        badge.className = 'badge off';
        badge.textContent = 'Hors ligne' + (lm ? ' · depuis le ' + fmt(lm) : '');
      } else if (isLive) {
        badge.className = 'badge off';
        badge.textContent = 'Hors ligne · depuis le ' + fmt(last);
      } else {
        badge.className = 'badge';
        badge.textContent = 'Enregistrement · ' + fmt(last);
      }
    } catch (e) {
      badge.className = 'badge'; badge.textContent = 'Statut inconnu';
    }
  }

  // --- Météo -------------------------------------------------------------------------
  // Sous-titre (températures) : Open-Meteo, lisible depuis une page locale.
  // Tableau : page GoSurf lue via le relais r.jina.ai (GoSurf bloque la lecture directe depuis file://),
  // avec les données Open-Meteo en secours si le relais échoue.
  const METEO_URL = 'https://gosurf.fr/webcam/fr/170/Hossegor-Plage-de-la-Nord';
  const HOURS = 12;

  async function openMeteo() {
    const q = '?latitude=43.66&longitude=-1.44&timezone=Europe%2FParis&forecast_hours=' + HOURS;
    const [a, w] = await Promise.all([
      fetch('https://api.open-meteo.com/v1/forecast' + q + '&wind_speed_unit=kmh&current=temperature_2m&hourly=wind_speed_10m,wind_direction_10m').then(r => r.json()),
      fetch('https://marine-api.open-meteo.com/v1/marine' + q + '&current=sea_surface_temperature&hourly=wave_height,wave_direction,wave_period,sea_level_height_msl').then(r => r.json()),
    ]);
    return {
      air: Math.round(a.current.temperature_2m),
      water: Math.round(w.current.sea_surface_temperature),
      cols: a.hourly.time.map((t, i) => {
        const lv = w.hourly.sea_level_height_msl, tide = lv[i], next = lv[i + 1];
        const lo = Math.min(...lv), hi = Math.max(...lv);
        return {
          now: i === 0,
          day: new Date(t.slice(0, 10) + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', timeZone: 'UTC' }),
          h: t.slice(11, 13) + 'h',
          wind: Math.round(a.hourly.wind_speed_10m[i]), windDir: a.hourly.wind_direction_10m[i] + 180,
          wave: w.hourly.wave_height[i].toFixed(1), waveDir: w.hourly.wave_direction[i] + 180,
          per: Math.round(w.hourly.wave_period[i]),
          tide: { pct: hi > lo ? (tide - lo) / (hi - lo) * 100 : 50, label: tide.toFixed(1) + (next == null ? '' : next > tide ? ' ↑' : ' ↓') },
        };
      }),
    };
  }

  // Texte du jour : bulletin Yadusurf (titre, houle, vent), caché dans le title de chaque image de prévision.
  const YADU_URL = 'https://www.yadusurf.com/Meteo-Surf-Report/La-Graviere/1284';
  async function yaduSurf() {
    const res = await fetch('https://r.jina.ai/' + YADU_URL, { headers: { 'X-No-Cache': 'true', 'X-Return-Format': 'html' }, signal: AbortSignal.timeout(20000) });
    if (!res.ok) throw new Error('Yadusurf HTTP ' + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const days = [...doc.querySelectorAll('img[src*="SurfDayImage"]')].map(img => {
      const date = img.getAttribute('src').match(/dayNumber=(\d{8})/)?.[1];
      const lines = (img.getAttribute('title') || '').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
      return date && lines.length && { date, head: lines[0], rest: lines.slice(1).join(' ') };
    }).filter(Boolean);
    if (!days.length) throw new Error('texte introuvable');
    return days;
  }
  const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const yaduHtml = d => '<b>' + esc(d.head) + '</b>' + esc(d.rest);

  async function gosurfTable() {
    const res = await fetch('https://r.jina.ai/' + METEO_URL, { headers: { 'X-No-Cache': 'true', 'X-Return-Format': 'html' } });
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const rows = [...doc.querySelectorAll('table tr')];
    const row = label => { const r = rows.find(r => r.querySelector('th')?.textContent.trim().startsWith(label)); return r && [...r.querySelectorAll('td')]; };
    const hours = row(''), wind = row('Vent'), wave = row('Houle'), per = row('Période'), tide = row('Marées');
    const air = row('Température Air'), water = row('Température eau'), cloud = row('Couverture'), rain = row('Précipitation');   // facultatives : Open-Meteo prend le relais si elles manquent
    if (!hours || !wind || !wave || !per || !tide) throw new Error('tableau introuvable');

    const start = Math.max(0, hours.findIndex(td => td.classList.contains('current')));
    const rotation = td => parseFloat(td.querySelector('.pi-compas')?.style.transform.match(/rotate\(([-\d.]+)/)?.[1]);
    const txt = td => td.textContent.replace(/\s+/g, ' ').trim();
    const cols = [];
    for (let i = 0; i < hours.length; i++) {
      const bar = tide[i].querySelector('.bar'), info = tide[i].querySelector('.text');
      const t = info && [...info.querySelectorAll('div')].map(txt).filter(Boolean);
      cols.push({
        now: i === start,
        date: new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris' }).format(new Date(Date.now() + (i - start) * 36e5)),   // YYYY-MM-DD du créneau
        day: txt(hours[i]).replace(/\s*\d+h$/, ''),
        h: txt(hours[i]).match(/(\d+h)$/)[1],
        wind: Math.round(parseFloat(txt(wind[i]))), windDir: rotation(wind[i]),
        wave: parseFloat(txt(wave[i])).toFixed(1), waveDir: rotation(wave[i]),
        per: parseFloat(txt(per[i])),
        air: air ? parseFloat(txt(air[i])) : NaN, water: water ? parseFloat(txt(water[i])) : NaN,
        cloud: cloud ? parseFloat(txt(cloud[i])) : NaN, rain: rain ? parseFloat(txt(rain[i])) || 0 : NaN,
        tide: { pct: parseFloat(bar?.style.height) || 0, label: t ? (info.querySelector('.pi-high-tide') ? 'PM ' : 'BM ') + t.join(' ') : '' },
      });
    }
    // GoSurf ne donne le coefficient qu'aux pleines mers : une basse mer reprend celui de la pleine mer qui la précède
    // (ou, en début de tableau, de celle qui la suit).
    const coefOf = c => (c.tide.label.match(/^PM \d+h\d+ (\d+)$/) || [])[1];
    const low = c => /^BM \d+h\d+$/.test(c.tide.label);
    let coef = null;
    cols.forEach(c => { if (coefOf(c)) coef = coefOf(c); else if (low(c) && coef) c.tide.label += ' ' + coef; });
    coef = null;
    for (let i = cols.length - 1; i >= 0; i--) { if (coefOf(cols[i])) coef = coefOf(cols[i]); else if (low(cols[i]) && coef) cols[i].tide.label += ' ' + coef; }
    if (!cols.length || cols.some(c => isNaN(c.wind) || isNaN(c.wave))) throw new Error('données invalides');
    return cols;
  }

  // Flèche tournée de l'angle donné = sens de déplacement du vent / de la houle (comme GoSurf).
  // ➤ pointe vers la droite (est) : on retire 90° pour qu'il suive la direction (0° = nord).
  const arrow = deg => isNaN(deg) ? '' : '<span class="arrow" style="transform:rotate(' + (deg - 90) + 'deg)">➤</span>';

  // Comme GoSurf : icône (haute / basse), heure, puis coefficient pour les pleines mers.
  function tideText(label) {
    const m = label.match(/^(PM|BM) (\d+h\d+)(?: (\d+))?$/);
    if (!m) return label;
    const high = m[1] === 'PM';
    return '<b class="ti" title="marée ' + (high ? 'haute' : 'basse') + '">' + (high ? '⤒' : '⤓') + '</b><div>' + m[2] + '</div>' + (m[3] ? '<div>' + m[3] + '</div>' : '');
  }

  // Lever / coucher du soleil (formule NOAA simplifiée) en heure décimale de Paris, pour le jour « YYYY-MM-DD » : sert à choisir soleil ou lune.
  const parisHour = d => { const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(d); return +p.find(x => x.type === 'hour').value + +p.find(x => x.type === 'minute').value / 60; };
  function sunTimes(dayKey) {
    const rad = Math.PI / 180, lat = 43.66, lon = -1.44;
    const d = Date.parse(dayKey + 'T12:00:00Z') / 864e5 - 10957.5;
    const M = (357.5291 + 0.98560028 * d) * rad;
    const lam = M + (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) * rad + (180 + 102.9372) * rad;
    const dec = Math.asin(Math.sin(lam) * Math.sin(23.44 * rad));
    const noon = 0.5 - lon / 360 + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);   // jours UTC
    const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec))) / (2 * Math.PI);
    const at = f => new Date(Date.parse(dayKey + 'T00:00:00Z') + f * 864e5);
    return [parisHour(at(noon - w)), parisHour(at(noon + w))];
  }
  // Symbole météo d'un créneau d'après la couverture nuageuse (%) et les précipitations (mm/h) de GoSurf.
  const NIGHT_ICON = '🌛';
  function weatherIcon(x, night) {
    const c = x.cloud, r = x.rain;
    if (r >= 2) return '🌧️';
    if (r >= 0.1) return c < 70 && !night ? '🌦️' : '🌧️';
    if (night) return NIGHT_ICON;   // un seul pictogramme la nuit (la pluie garde le sien)
    return c < 15 ? '☀️' : c < 40 ? '🌤️' : c < 75 ? '⛅' : '☁️';
  }

  function renderTable(cols, yadu) {
    // Classes de colonne : « now » (heure courante) et « newday » (premier créneau d'un nouveau jour, séparateur à gauche).
    const cls = (x, i, extra) => [extra, x.now && 'now', i > 0 && x.day !== cols[i - 1].day && 'newday'].filter(Boolean).join(' ');
    const cell = fn => cols.map((x, i) => '<td class="' + cls(x, i) + '">' + fn(x) + '</td>').join('');
    // Ligne « Météo » : symbole par créneau (absente du tableau de secours Open-Meteo, qui n'a pas ces données).
    let meteoRow = '';
    if (cols.every(x => isFinite(x.cloud) && isFinite(x.rain))) {
      const suns = {};
      meteoRow = '<tr><th>Météo</th>' + cols.map((x, i) => {
        const [rise, set] = suns[x.date] || (suns[x.date] = sunTimes(x.date)), t = parseInt(x.h) + 0.5;
        // Nuit : jusqu'à 30 min avant le lever du soleil, et dès 30 min après son coucher.
        const icon = weatherIcon(x, t < rise - 0.5 || t > set + 0.5);
        const hm = h => { const m = Math.round(h * 60); return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); };
        const title = icon === NIGHT_ICON ? (t < 12 ? 'Lever du soleil ' + hm(rise) : 'Coucher du soleil ' + hm(set))
          : 'Nuages ' + x.cloud + ' % · pluie ' + x.rain + ' mm/h';
        return '<td class="' + cls(x, i, 'wx') + '" title="' + title + '">' + icon + '</td>';
      }).join('') + '</tr>';
    }
    const tideCell = cols.map((x, i) => '<td class="' + cls(x, i, 'tide') + '" style="--p:' + x.tide.pct.toFixed(0) + '%"><span>' + tideText(x.tide.label) + '</span></td>').join('');
    // Ligne « Résumé » : une case fusionnée par jour (colspan = nombre de créneaux du jour) avec le texte Yadusurf.
    let resume = '';
    if (yadu) {
      const groups = [];
      cols.forEach((x, i) => { if (i > 0 && x.day === cols[i - 1].day) groups[groups.length - 1].n++; else groups.push({ day: x.day, n: 1, first: i }); });
      const cells = groups.map(g => {
        const dom = +((g.day || '').match(/\d+/) || [])[0], d = yadu.find(y => +y.date.slice(6) === dom);
        return '<td colspan="' + g.n + '"' + (g.first > 0 ? ' class="newday"' : '') + '>' + (d ? '<div>' + yaduHtml(d) + '</div>' : '') + '</td>';
      });
      resume = '<tr class="resume"><th>Résumé</th>' + cells.join('') + '</tr>';
    }
    document.getElementById('meteo').innerHTML = '<table>' +
      '<tr class="hours"><th>Heure</th>' + cell(x => (x.day ? '<span class="day">' + x.day + '</span>' : '') + x.h) + '</tr>' + resume +
      '<tr><th>Houle (m)</th>' + cell(x => x.wave + arrow(x.waveDir)) + '</tr>' +
      '<tr><th>Période (s)</th>' + cell(x => x.per) + '</tr>' +
      '<tr><th>Vent (km/h)</th>' + cell(x => x.wind + arrow(x.windDir)) + '</tr>' + meteoRow +
      '<tr><th>Marée</th>' + tideCell + '</tr>' +
      '</table>';
    const box = document.getElementById('meteo'), now = box.querySelector('td.now');
    if (now) box.scrollLeft = now.offsetLeft - now.parentNode.firstChild.offsetWidth;   // hors 6h-22h : pas de colonne « maintenant »
  }

  // Prochaine pleine ou basse mer (« haute 17h05 ») à partir de maintenant ; absente du tableau de secours.
  function nextTide(cols) {
    const d = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
    const min = +d.find(p => p.type === 'hour').value * 60 + +d.find(p => p.type === 'minute').value;
    const from = cols.findIndex(c => c.now);
    for (let i = from; i < cols.length; i++) {
      const m = cols[i].tide.label.match(/^(PM|BM) (\d+)h(\d+)/);
      if (m && (i > from || +m[2] * 60 + +m[3] >= min)) return (m[1] === 'PM' ? 'haute ' : 'basse ') + m[2] + 'h' + m[3];
    }
  }

  function skeleton() {
    const sk = '<td><i class="sk"></i></td>'.repeat(HOURS);
    document.getElementById('subtitle').innerHTML =
      '<blockquote class="quote" style="width:100%"><div class="quote-text"><i class="sk" style="width:50%;height:20px;margin:3px 0 9px"></i><i class="sk" style="width:100%;height:15px"></i></div></blockquote>' +
      '<div class="stats">' + '<i class="sk sk-stat"></i>'.repeat(5) + '</div>';
    document.getElementById('meteo').innerHTML = '<table class="loading" aria-busy="true">' +
      ['Heure', 'Résumé', 'Houle (m)', 'Période (s)', 'Vent (km/h)', 'Météo', 'Marée'].map(l =>
        '<tr><th>' + l + '</th>' + (l === 'Résumé' ? '<td colspan="' + HOURS + '"><i class="sk" style="width:60%;height:18px;margin:0 auto"></i></td>' : sk) + '</tr>').join('') + '</table>';
  }

  function updateEyebrow() {
    const now = new Date(), tz = { timeZone: 'Europe/Paris' };
    document.getElementById('eyebrow').textContent = 'Surf report du ' +
      now.toLocaleDateString('fr-FR', { ...tz, day: 'numeric', month: 'long' }) + ' à ' +
      now.toLocaleTimeString('fr-FR', { ...tz, hour: '2-digit', minute: '2-digit' });
  }
  updateEyebrow();
  setInterval(updateEyebrow, 30000);

  async function loadMeteo() {
    skeleton();
    const el = document.getElementById('subtitle');
    const [table, yadu] = await Promise.allSettled([gosurfTable(), yaduSurf()]);
    const texts = yadu.status === 'fulfilled' ? yadu.value : null;
    // Open-Meteo ne sert que de secours : tableau GoSurf illisible, ou températures absentes du tableau.
    const gs = table.status === 'fulfilled' ? table.value : null, gsNow = gs && gs.find(c => c.now);
    const gsTemps = gsNow && isFinite(gsNow.air) && isFinite(gsNow.water);
    const meteo = gsTemps ? null : await openMeteo().catch(() => null);
    const cols = gs || (meteo && meteo.cols);
    const temps = gsTemps ? { air: gsNow.air, water: gsNow.water } : meteo;
    // Cartouches : houle, vent, marée, air, eau.
    const stat = (inner, label, extra = '') => '<div class="stat ' + extra + '"><span class="stat-val">' + inner + '</span><span class="stat-label">' + label + '</span></div>';
    const val = (v, unit, dir) => v + '<small>' + unit + '</small>' + arrow(dir);
    const items = [];
    const cur = cols && cols.find(c => c.now);
    if (cur) {
      items.push(stat(val(cur.wave, ' m', cur.waveDir) + '<span class="per">' + cur.per + '<small> s</small></span>', 'Houle'),
                 stat(val(cur.wind, ' km/h', cur.windDir), 'Vent'));
    }
    const t = cols && nextTide(cols);   // « haute 17h05 » / « basse 23h11 »
    if (t) {
      const [kind, time] = t.split(' ');
      items.push(stat('<span class="tide-ic">' + (kind === 'haute' ? '⤒' : '⤓') + '</span>' + time, 'Marée ' + kind));
    }
    if (temps) {
      items.push(stat(val(temps.air, ' °C'), 'Air', 'center'), stat(val(temps.water, ' °C'), 'Eau', 'center'));
    }
    // Texte du jour entre guillemets, sous le titre et au-dessus des cartouches.
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris' }).format(new Date()).replace(/-/g, '');
    const todayText = texts && texts.find(d => d.date === today);
    el.innerHTML = (todayText ? '<blockquote class="quote"><div class="quote-text">' + yaduHtml(todayText) + '</div></blockquote>' : '') +
      (items.length ? '<div class="stats">' + items.join('') + '</div>' : '');
    // Le tableau n'affiche que les créneaux de 6h à 22h (les cartouches et la prochaine marée utilisent toutes les colonnes).
    const daytime = cols && cols.filter(c => { const h = parseInt(c.h); return h >= 6 && h <= 22; });
    if (daytime && daytime.length) renderTable(daytime, texts);
    else document.getElementById('meteo').innerHTML = '';
    const fromGoSurf = !!gs, tempsFromOpenMeteo = !gsTemps && !!meteo;
    document.getElementById('source').textContent = !cols ? '' : 'Source : ' +
      (fromGoSurf ? 'GoSurf' + (tempsFromOpenMeteo ? ' (prévisions), Open-Meteo (températures)' : '') : 'Open-Meteo') + (texts ? ', Yadusurf (résumés)' : '');
  }
  loadMeteo();

  const grid = document.getElementById('grid');
  quanteecSourceHandler.register();

  CAMS.forEach((cam, i) => {
    const box = document.createElement('section');
    box.className = 'cam';
    box.innerHTML = '<div class="frame"></div><div class="head"><h2></h2><span class="badge"></span></div>';
    box.querySelector('h2').textContent = cam.title;
    const badge = box.querySelector('.badge');
    const frame = box.querySelector('.frame');
    grid.appendChild(box);

    if (cam.type === 'iframe') {
      badge.textContent = 'Timelapse';
      const f = document.createElement('iframe');
      f.src = cam.src;
      f.allow = 'autoplay; fullscreen';
      f.allowFullscreen = true;
      f.scrolling = 'no';
      frame.appendChild(f);
      return;
    }

    const el = document.createElement('video-js');
    el.id = 'cam' + i;
    el.className = 'vjs-default-skin vjs-big-play-centered';
    el.setAttribute('playsinline', '');
    frame.appendChild(el);

    const isLive = cam.type === 'live';
    const fail = msg => { const d = document.createElement('div'); d.className = 'err'; d.textContent = msg; frame.appendChild(d); };

    currentSource(cam).then(c => {
      const cfg = { clientID: 'viewsurf', videoID: c.id, refreshSources: true, externalLive: isLive };
      return quanteecSourceHandler.Quanteec.getSourceUrls(cfg).then(s => ({ s, cfg, c }));
    }).then(({ s, cfg, c }) => {
      if (!s || !s.m3u8) return fail('Aucune source retournée');
      updateBadge(badge, s.m3u8, isLive);
      setInterval(() => updateBadge(badge, s.m3u8, isLive), 60000);
      const player = videojs(el, {
        controls: true, autoplay: 'any', muted: true, loop: true, liveui: false, fill: true,
        techOrder: ['html5'], poster: s.poster || c.poster,
        html5: { quanteec: cfg, hlsjsConfig: { startLevel: 0, liveSyncDurationCount: 5, initialLiveManifestSize: 3 } }
      });
      player.src([{ src: s.m3u8, type: 'application/x-mpegurl' }]);
      player.on('error', () => fail('Erreur lecteur'));
    }).catch(e => fail('Erreur : ' + e));
  });
</script>
</body>
</html>
